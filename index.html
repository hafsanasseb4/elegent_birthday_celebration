
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Aran!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #050505;
      }
      .font-playfair { font-family: 'Playfair Display', serif; }
      .font-montserrat { font-family: 'Montserrat', sans-serif; }
      .font-script { font-family: 'Great Vibes', cursive; }
      
      /* Gold Text Effect */
      .gold-text {
        background: linear-gradient(to bottom, #f9f295, #e0aa3e, #b8860b, #e0aa3e, #f9f295);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0px 4px 8px rgba(0,0,0,0.5);
      }

      /* Animated Sparkle */
      @keyframes sparkle {
        0%, 100% { opacity: 0; transform: scale(0); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .sparkle-particle {
        position: absolute;
        background: radial-gradient(circle, #fff 0%, rgba(212, 175, 55, 0.8) 50%, transparent 100%);
        border-radius: 50%;
        pointer-events: none;
      }

      @keyframes float-heart {
        0% { transform: translateY(0) translateX(0) scale(1) rotate(0deg); opacity: 0; }
        20% { opacity: 0.8; }
        100% { transform: translateY(-100vh) translateX(50px) scale(0.5) rotate(360deg); opacity: 0; }
      }

      .animate-heart {
        animation: float-heart 10s linear infinite;
      }

      canvas#fireworks {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  <script type="importmap">

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <canvas id="fireworks"></canvas>
    <div id="root"></div>

</body>
</html>
